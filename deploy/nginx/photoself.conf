# photoSelf behind Nginx
#
# This sample serves the SPA at / and keeps the API at /api/.
# Configure photoSelf with:
#   media.serve_mode = "proxy"
#   public_media_path = "/media"
#   public_thumb_path = "/thumbs"
#   auth.mode = "proxy"   (or keep Nginx Basic Auth and auth.mode = "none")

server {
    listen 8443 ssl;
    http2 on;
    server_name photos.example.com;

    ssl_certificate     /etc/nginx/certs/photos.crt;
    ssl_certificate_key /etc/nginx/certs/photos.key;

    auth_basic           "photoSelf";
    auth_basic_user_file /etc/nginx/photoself.htpasswd;

    root /opt/photoself/ui;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User $remote_user;
        client_max_body_size 100m;
    }

    # /thumbs/<aa>/<bb>/<hash>-<size>.jpg
    location /thumbs/ {
        alias /var/lib/photoself/data/cache/thumbs/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /media/<library-id>/<relative-path>; add one location per library.
    location /media/family/ {
        alias /srv/photos/;
        expires 7d;
        add_header Accept-Ranges bytes;
    }
}
