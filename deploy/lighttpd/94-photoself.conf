# photoSelf behind lighttpd
#
# Layout assumed here:
#   UI:        /mnt/usb/photo-app/ui/                 (npm run build output)
#   API:       http://127.0.0.1:8787                   (photoself serve)
#   thumbnails:/mnt/usb/photo-app/data/cache/thumbs/
#   library:   /mnt/photos/                     (id = "family")
#
# The SPA is served under /photo/ with relative assets (vite base './').
# The API stays at /api/ so the SPA's absolute /api/v1 calls keep working.
# Media URLs are /photo/media/<library-id>/<relative-path>.

# Auth for UI + API
$HTTP["url"] =~ "^(/photo|/api)($|/)" {
    auth.backend = "plain"
    auth.backend.plain.userfile = "/etc/lighttpd/lighttpd.user"
    auth.require = (
        "/" => ("method" => "basic", "realm" => "photoSelf", "require" => "valid-user")
    )
    auth.cache = ("max-age" => "3600")
}

# Rust API (no path rewrite: backend already listens on /api/v1)
$HTTP["url"] =~ "^/api/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8787 )) )
}

alias.url += (
    "/photo/thumbs/"        => "/mnt/usb/photo-app/data/cache/thumbs/",
    "/photo/media/family/"  => "/mnt/photos/",
    "/photo/"               => "/mnt/usb/photo-app/ui/"
)
